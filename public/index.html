<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EDF CHALLENGE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root {
  --red: #cc0000;
  --green: #88ff55;
  --font-h: 'Orbitron', sans-serif;
  --font-m: 'Share Tech Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #080808;
  color: #ddd;
  font-family: var(--font-m);
  overflow: hidden;
  touch-action: manipulation;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
  pointer-events: none;
  z-index: 9999;
}
.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.screen.active { display: flex; }

/* ===== START ===== */
#screen-start {
  background: radial-gradient(ellipse at center, #1a0000 0%, #050505 70%);
  gap: 28px;
  padding: 48px 28px;
  text-align: center;
}
.start-edf-logo {
  font-family: var(--font-h);
  font-size: 72px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 10px;
  border: 3px solid var(--red);
  padding: 6px 28px;
  background: rgba(204,0,0,0.1);
  text-shadow: 0 0 40px rgba(255,80,80,0.4);
}
.start-title {
  font-family: var(--font-h);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--red);
  line-height: 1.6;
  text-shadow: 0 0 20px rgba(204,0,0,0.6);
}
.start-subtitle {
  font-size: 13px;
  letter-spacing: 2px;
  color: #777;
  line-height: 1.9;
  max-width: 300px;
}
.btn-challenge {
  font-family: var(--font-h);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 5px;
  background: var(--red);
  color: #fff;
  border: none;
  padding: 20px 48px;
  cursor: pointer;
  border-radius: 4px;
  box-shadow: 0 0 32px rgba(204,0,0,0.6);
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn-challenge:active { transform: scale(0.95); box-shadow: 0 0 12px rgba(204,0,0,0.4); }
.start-footer {
  font-size: 10px;
  color: #444;
  letter-spacing: 2px;
}

/* ===== QUIZ ===== */
#screen-quiz { background: #080808; justify-content: flex-start; }
.quiz-header {
  width: 100%;
  padding: 22px 24px 18px;
  background: rgba(204,0,0,0.08);
  border-bottom: 1px solid rgba(204,0,0,0.3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.quiz-header-label {
  font-family: var(--font-h);
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--red);
}
.quiz-header-progress {
  font-family: var(--font-m);
  font-size: 13px;
  color: #666;
}
.quiz-body {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 24px;
  gap: 28px;
}
.quiz-q-num {
  font-family: var(--font-h);
  font-size: 11px;
  letter-spacing: 5px;
  color: #444;
  align-self: flex-start;
}
.quiz-q-text {
  font-family: var(--font-m);
  font-size: 18px;
  letter-spacing: 2px;
  color: #eee;
  line-height: 1.9;
  text-align: center;
  white-space: pre-line;
  width: 100%;
}
.quiz-choices {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.choice-btn {
  width: 100%;
  font-family: var(--font-m);
  font-size: 15px;
  letter-spacing: 2px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.13);
  color: #bbb;
  padding: 18px 20px;
  text-align: left;
  cursor: pointer;
  border-radius: 3px;
  transition: background 0.1s, border-color 0.1s;
}
.choice-btn:active {
  background: rgba(204,0,0,0.18);
  border-color: rgba(204,0,0,0.6);
  color: #fff;
}
.choice-btn:disabled { opacity: 0.5; cursor: default; }

/* ===== WRONG ===== */
#screen-wrong {
  background: rgba(0,0,0,0.97);
  gap: 28px;
  padding: 48px 28px;
  text-align: center;
}
.wrong-label {
  font-family: var(--font-h);
  font-size: 52px;
  font-weight: 900;
  color: var(--red);
  letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(204,0,0,0.8);
  animation: wrong-flash 0.35s ease 4;
}
@keyframes wrong-flash {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.1; }
}
.wrong-text {
  font-family: var(--font-m);
  font-size: 15px;
  letter-spacing: 2px;
  color: #ccc;
  line-height: 1.9;
  white-space: pre-line;
  max-width: 320px;
}

/* ===== PROCESSING ===== */
#screen-processing { background: #000; gap: 20px; text-align: center; }
.processing-label {
  font-family: var(--font-h);
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--red);
  animation: blink 0.7s ease infinite;
}
.processing-sub {
  font-size: 12px;
  letter-spacing: 3px;
  color: #444;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

/* ===== RESULT ===== */
#screen-result {
  background: #060606;
  justify-content: flex-start;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.result-wrap {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 24px 20px 48px;
}
.result-alert {
  font-family: var(--font-h);
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--red);
  text-align: center;
  line-height: 1.7;
}
#result-canvas {
  width: 100%;
  max-width: 340px;
  border: 2px solid rgba(204,0,0,0.5);
  box-shadow: 0 0 32px rgba(204,0,0,0.25);
  display: block;
}
.result-qr-box {
  width: 100%;
  max-width: 340px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.result-qr-label {
  font-size: 12px;
  letter-spacing: 3px;
  color: #888;
  text-align: center;
}
#qr-code { background: #fff; padding: 8px; border-radius: 4px; }
.result-qr-note {
  font-size: 11px;
  color: #555;
  letter-spacing: 1px;
  text-align: center;
  line-height: 1.7;
}
.btn-retry {
  font-family: var(--font-h);
  font-size: 13px;
  letter-spacing: 4px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2);
  color: #888;
  padding: 16px 36px;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.1s;
}
.btn-retry:active { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>

<video id="camera-video" autoplay playsinline muted
  style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0;"></video>

<!-- ===== START ===== -->
<div id="screen-start" class="screen active">
  <div class="start-edf-logo">EDF</div>
  <div class="start-title">隊員適性<br>チャレンジ</div>
  <div class="start-subtitle">地球防衛軍への入隊資格を問う<br>3問のクイズに挑め<br>果たして合格できるか——</div>
  <button class="btn-challenge" id="btn-start">▶ 挑戦開始</button>
  <div class="start-footer">TGS2026 / D3PUBLISHER / EARTH DEFENSE FORCE</div>
</div>

<!-- ===== QUIZ ===== -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-header-label">APTITUDE TEST</div>
    <div class="quiz-header-progress" id="quiz-progress">1 / 3</div>
  </div>
  <div class="quiz-body">
    <div class="quiz-q-num" id="quiz-q-num">Q.01</div>
    <div class="quiz-q-text" id="quiz-q-text"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
  </div>
</div>

<!-- ===== WRONG ===== -->
<div id="screen-wrong" class="screen">
  <div class="wrong-label">不正解！</div>
  <div class="wrong-text" id="wrong-text"></div>
</div>

<!-- ===== PROCESSING ===== -->
<div id="screen-processing" class="screen">
  <div class="processing-label">CAPTURING...</div>
  <div class="processing-sub">巨大生物が接近中</div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div class="result-wrap">
    <div class="result-alert">⚠ あなたは巨大生物に捕まりました ⚠</div>
    <canvas id="result-canvas"></canvas>
    <div class="result-qr-box">
      <div class="result-qr-label">QRコードをスキャンして画像を保存</div>
      <div id="qr-code"></div>
      <div class="result-qr-note">スマートフォンのカメラで読み取ってください<br>画像は本日限り有効です</div>
    </div>
    <button class="btn-retry" id="btn-retry">▶ もう一度挑戦する</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: 'EDF隊員として\n任務開始時に最初にすべきことは？',
    choices: ['武器の安全装置を外す', '周囲の敵を確認する', '仲間と連携を取る'],
    wrong: '不正解！\n正解は「EDF！と叫ぶ」こと！\n士気こそが最初の武器だ！'
  },
  {
    q: '巨大生物100体に囲まれた時の\n最善策は何か？',
    choices: ['全力で応戦する', '援軍を要請する', '高台へ退避する'],
    wrong: '不正解！\n正解は「叫びながら突撃」！\n退路などそもそもない！'
  },
  {
    q: 'EDF史上\n最強の武器とは何か？',
    choices: ['ストームチームの特殊ライフル', 'フェンサーの重装甲', 'エアレイダーの航空支援'],
    wrong: '不正解！\n最強の武器は「魂」だ！EDF！\n\n...あなたは巨大生物に捕まりました。'
  }
];

// ===== 顔はめ楕円の位置 (背景画像に対する比率) =====
// ※ズレる場合はここを調整してください
const OVAL = { cx: 0.50, cy: 0.375, rx: 0.145, ry: 0.095 };

let currentQ = 0;
let capturedFrame = null;
const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// ===== カメラ =====
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    $('camera-video').srcObject = stream;
    await new Promise(r => { $('camera-video').onloadedmetadata = r; });
  } catch(e) {
    console.warn('Camera unavailable:', e);
  }
}

function captureVideoFrame() {
  const v = $('camera-video');
  if (!v.videoWidth) return null;
  const c = document.createElement('canvas');
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  return c;
}

// ===== 顔検出 (FaceDetector API → フォールバック: 中央クロップ) =====
async function getFaceBounds(src) {
  if ('FaceDetector' in window) {
    try {
      const fd = new FaceDetector({ maxDetectedFaces: 1, fastMode: true });
      const faces = await fd.detect(src);
      if (faces.length > 0) {
        const b = faces[0].boundingBox;
        const pad = b.width * 0.45;
        return {
          x: Math.max(0, b.x - pad),
          y: Math.max(0, b.y - pad * 0.2),
          w: Math.min(src.width, b.width + pad * 2),
          h: Math.min(src.height, b.height + pad * 1.6)
        };
      }
    } catch(e) {}
  }
  // フォールバック: 上半身中央クロップ
  const size = src.width * 0.72;
  return { x: (src.width - size) / 2, y: src.height * 0.02, w: size, h: size * 1.1 };
}

// ===== 画像合成 =====
async function compositeImage(frame) {
  return new Promise(async resolve => {
    const bg = new Image();
    bg.onload = async () => {
      const W = bg.naturalWidth;
      const H = bg.naturalHeight;
      const canvas = $('result-canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(bg, 0, 0, W, H);

      if (frame) {
        const face = await getFaceBounds(frame);
        const cx = W * OVAL.cx;
        const cy = H * OVAL.cy;
        const rx = W * OVAL.rx;
        const ry = H * OVAL.ry;

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(frame, face.x, face.y, face.w, face.h, cx - rx, cy - ry, rx * 2, ry * 2);
        ctx.restore();
      }

      resolve(canvas);
    };
    bg.src = '/image_edf_face_panel.png';
  });
}

// ===== サーバーへ保存 =====
async function uploadImage(canvas) {
  try {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
    const res = await fetch('/save-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl })
    });
    const data = await res.json();
    return data.url;
  } catch(e) {
    console.error('Upload error:', e);
    return null;
  }
}

// ===== QRコード生成 =====
function generateQR(url) {
  $('qr-code').innerHTML = '';
  new QRCode($('qr-code'), {
    text: url,
    width: 180, height: 180,
    colorDark: '#000', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

// ===== クイズ =====
function showQuiz(index) {
  currentQ = index;
  const q = QUESTIONS[index];
  $('quiz-progress').textContent = `${index + 1} / ${QUESTIONS.length}`;
  $('quiz-q-num').textContent = `Q.0${index + 1}`;
  $('quiz-q-text').textContent = q.q;

  const wrap = $('quiz-choices');
  wrap.innerHTML = '';
  q.choices.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${'ABC'[i]}.  ${text}`;
    btn.addEventListener('click', () => onChoiceClick());
    wrap.appendChild(btn);
  });

  showScreen('screen-quiz');
}

function onChoiceClick() {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  const isLast = currentQ === QUESTIONS.length - 1;
  if (isLast) capturedFrame = captureVideoFrame();

  $('wrong-text').textContent = QUESTIONS[currentQ].wrong;
  showScreen('screen-wrong');

  setTimeout(() => {
    if (isLast) {
      showScreen('screen-processing');
      processResult();
    } else {
      showQuiz(currentQ + 1);
    }
  }, 2400);
}

async function processResult() {
  const canvas = await compositeImage(capturedFrame);
  const url = await uploadImage(canvas);
  showScreen('screen-result');
  if (url) {
    generateQR(url);
  } else {
    $('qr-code').textContent = '通信エラー';
  }
}

// ===== リトライ =====
$('btn-retry').addEventListener('click', () => {
  capturedFrame = null;
  $('qr-code').innerHTML = '';
  showQuiz(0);
});

// ===== スタート =====
$('btn-start').addEventListener('click', async () => {
  await startCamera();
  showQuiz(0);
});

// サーバーをスリープさせない (5分ごとにpingを送る)
setInterval(() => fetch('/ping').catch(() => {}), 5 * 60 * 1000);
</script>
</body>
</html>
